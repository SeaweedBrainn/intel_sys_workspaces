# The robot's stacks as compose services, one launch file each, on the Jetson, plus the
# Zenoh router they all talk through. Use it through scripts/robot.sh:
#
#   scripts/robot.sh up                    # drivers, robot description and health
#   scripts/robot.sh up localization       # + Point-LIO and RTAB-Map (mapping)
#   scripts/robot.sh up navigation         # + Nav2 on RTAB-Map's /map
#   scripts/robot.sh up foxglove           # Foxglove bridge on the Tailscale address, port 8765
#   scripts/robot.sh ps | logs -f <service> | stop <service> | down
#
# Drivers, the robot description and health restart on their own after a crash or reboot.
# Localization and navigation do not: a Point-LIO restart re-anchors odometry
# wherever the robot is, and a mapping restart wipes the map, so they are started
# deliberately for each session.
#
# Least privilege: only the STM32 stack gets privileged /dev access (the board can
# re-enumerate as a different ttyACM). The LiDAR is on Ethernet. The camera gets the
# video and USB device classes only, not privileged mode. Nothing else touches
# hardware, and nothing can write to the workspace.

x-robot: &robot
  image: intel-sys-rover:latest
  network_mode: host
  ipc: host
  env_file:
    - docker/zenoh.env
  environment:
    - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
  volumes:
    - ./:/workspaces/intel_sys:ro
  depends_on:
    - zenohd
  init: true
  stop_grace_period: 10s

services:
  # Zenoh router: every stack's rmw_zenoh session connects to it (docker/zenoh/).
  zenohd:
    image: intel-sys-rover:latest
    container_name: intel-sys-zenohd
    network_mode: host
    ipc: host
    command: ["bash", "-lc", "source /opt/ros/humble/setup.bash && ros2 run rmw_zenoh_cpp rmw_zenohd"]
    volumes:
      - ./:/workspaces/intel_sys:ro
    env_file:
      - docker/zenoh.env
    restart: unless-stopped

  stm32:
    <<: *robot
    container_name: stm32stack
    privileged: true
    volumes:
      - ./:/workspaces/intel_sys:ro
      - /dev:/dev
      - /run/udev:/run/udev:ro
    command: ros2 launch intel_sys_hardware stm32.launch.py
    restart: unless-stopped

  lidar:
    <<: *robot
    container_name: lidarstack
    command: ros2 launch intel_sys_hardware lidar.launch.py
    restart: unless-stopped

  camera:
    <<: *robot
    container_name: camerastack
    # Only video (81) and raw USB (189) devices. /dev is mounted so the camera can
    # re-enumerate (e.g. after a USB reset) without recreating the container.
    volumes:
      - ./:/workspaces/intel_sys:ro
      - /dev:/dev
    device_cgroup_rules:
      - 'c 81:* rmw'
      - 'c 189:* rmw'
    command: ros2 launch intel_sys_hardware camera.launch.py
    restart: unless-stopped

  description:
    <<: *robot
    container_name: robot-description
    command: ros2 launch intel_sys_description robot_description.launch.py
    restart: unless-stopped

  localization:
    <<: *robot
    container_name: localization
    volumes:
      - ./:/workspaces/intel_sys:ro
      - ${ROBOT_DATA_DIR:-./data}:/data
    # SLAM_LOCALIZATION=true re-localizes on the saved map instead of mapping (and keeps it).
    # SLAM_CONTINUE=true keeps mapping into the saved map (a new session that joins it once
    # RTAB-Map recognizes a place; needs the camera). Default: a fresh map each start.
    # SLAM_CAMERA=false runs RTAB-Map on the LiDAR alone. With the camera on (default),
    # RTAB-Map waits for camera frames, so it stops updating if the camera stops.
    # SLAM=false runs Point-LIO alone (odom only, no map): used for tag following.
    command: >
      ros2 launch intel_sys_localization localization.launch.py
      slam:=${SLAM:-true} database_path:=/data/rtabmap.db
      slam_localization:=${SLAM_LOCALIZATION:-false}
      slam_continue:=${SLAM_CONTINUE:-false}
      slam_camera:=${SLAM_CAMERA:-true}
    profiles: [localization, navigation, follow]
    restart: "no"
    stop_grace_period: 60s   # RTAB-Map writes the map database on shutdown

  navigation:
    <<: *robot
    container_name: navigation
    depends_on:
      - zenohd
      - localization
    # With SLAM=false Nav2 plans in odom on the live LiDAR only (no stored map).
    command: ros2 launch intel_sys_navigation navigation.launch.py slam:=${SLAM:-true}
    profiles: [navigation, follow]
    restart: "no"

  # Frontier exploration, idle until /frontier_explorer/start (Foxglove's Explore button).
  explorer:
    <<: *robot
    container_name: explorer
    depends_on:
      - zenohd
      - navigation
    command: ros2 run intel_sys_navigation frontier_explorer --ros-args -p wait_for_start:=true
    profiles: [navigation]
    restart: "no"

  follow:
    <<: *robot
    container_name: follow
    depends_on:
      - zenohd
      - navigation
    # Tag following through Nav2, in odom: a target that pauses must not end up in a stored
    # map (RTAB-Map would keep it as an obstacle). Off until enabled:
    #   ros2 service call /tag_follower/enable std_srvs/srv/SetBool "{data: true}"
    # (or the service call panel in Foxglove). scripts/robot.sh up follow starts it.
    command: ros2 run intel_sys_navigation tag_follower --ros-args -p map_frame:=odom
    profiles: [follow]
    restart: "no"

  foxglove:
    <<: *robot
    container_name: foxglove
    # scripts/robot.sh up foxglove binds it to the Tailscale address. Clients can
    # publish (e.g. Nav2 goals), so it is not left on every interface.
    command: >
      ros2 run foxglove_bridge foxglove_bridge --ros-args
      -p address:=${FOXGLOVE_ADDRESS:-127.0.0.1} -p port:=8765
      -p send_buffer_limit:=100000000
    profiles: [foxglove]
    restart: "no"

  # Stream and transform health on /diagnostics, for Foxglove's Diagnostics panel.
  health:
    <<: *robot
    container_name: robot-health
    command: ros2 launch intel_sys_hardware health.launch.py
    restart: unless-stopped
