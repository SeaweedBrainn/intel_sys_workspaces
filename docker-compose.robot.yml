# The robot's stacks as compose services, one launch file each, on the Jetson.
# Use with the base file and the Zenoh overlay; scripts/robot.sh sets this up:
#
#   scripts/robot.sh up                    # drivers and robot description
#   scripts/dashboard.sh                   # dashboard (supplies its tokens), after the drivers
#   scripts/robot.sh up localization       # + Point-LIO and RTAB-Map (mapping)
#   scripts/robot.sh up navigation         # + Nav2 on RTAB-Map's /map
#   scripts/robot.sh ps | logs -f <service> | stop <service> | down
#
# Drivers and the dashboard restart on their own after a crash or reboot.
# Localization and navigation do not: a Point-LIO restart re-anchors odometry
# wherever the robot is, and a mapping restart wipes the map, so they are started
# deliberately for each session.
#
# Least privilege: only the STM32 stack gets privileged /dev access (the board can
# re-enumerate as a different ttyACM). The LiDAR is on Ethernet; nothing else
# touches hardware, and only the dashboard can write to the workspace.

x-robot: &robot
  image: ${ROBOT_IMAGE:-intel-sys-rover:latest}
  network_mode: host
  ipc: host
  env_file:
    - docker/zenoh.env
  environment:
    - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
  volumes:
    - ./:/workspaces/intel_sys:ro
  depends_on:
    - zenohd
  init: true
  stop_grace_period: 10s

services:
  stm32:
    <<: *robot
    container_name: stm32stack
    privileged: true
    volumes:
      - ./:/workspaces/intel_sys:ro
      - /dev:/dev
      - /run/udev:/run/udev:ro
    command: ros2 launch intel_sys_hardware stm32.launch.py
    restart: unless-stopped

  lidar:
    <<: *robot
    container_name: lidarstack
    command: ros2 launch intel_sys_hardware lidar.launch.py
    restart: unless-stopped

  description:
    <<: *robot
    container_name: robot-description
    command: ros2 launch intel_sys_description robot_description.launch.py
    restart: unless-stopped

  localization:
    <<: *robot
    container_name: localization
    volumes:
      - ./:/workspaces/intel_sys:ro
      - ${ROBOT_DATA_DIR:-./data}:/data
    # SLAM_LOCALIZATION=true re-localizes on the saved map instead of mapping (and keeps it).
    command: >
      ros2 launch intel_sys_localization localization.launch.py
      slam:=true database_path:=/data/rtabmap.db
      slam_localization:=${SLAM_LOCALIZATION:-false}
      slam_camera:=${SLAM_CAMERA:-false}
    profiles: [localization, navigation]
    restart: "no"

  navigation:
    <<: *robot
    container_name: navigation
    depends_on:
      - zenohd
      - localization
    command: ros2 launch intel_sys_navigation navigation.launch.py slam:=true
    profiles: [navigation]
    restart: "no"

  dashboard:
    <<: *robot
    container_name: robot-dashboard
    volumes:
      - ./:/workspaces/intel_sys
    # Started by scripts/dashboard.sh, which supplies the tokens and the Tailscale bind address.
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - DASHBOARD_HOST=${DASHBOARD_HOST:-127.0.0.1}
      - DASHBOARD_PORT=${DASHBOARD_PORT:-8080}
      - DASHBOARD_TOKEN=${DASHBOARD_TOKEN:-}
      - DASHBOARD_VIEW_TOKEN=${DASHBOARD_VIEW_TOKEN:-}
    command: python3 /workspaces/intel_sys/scripts/dashboard/dashboard.py
    restart: unless-stopped
