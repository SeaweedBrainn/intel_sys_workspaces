# GPU access for the dev containers on machines with an NVIDIA card. run_docker.sh adds
# this overlay to docker-compose.yml when it finds one (--nvidia / --cpu to force).
x-nvidia-gpu: &nvidia-gpu
  environment:
    - NVIDIA_VISIBLE_DEVICES=all
    - NVIDIA_DRIVER_CAPABILITIES=all,graphics,display,utility,compute
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  intel-sys-sim:
    <<: *nvidia-gpu
  intel-sys-rover:
    <<: *nvidia-gpu
