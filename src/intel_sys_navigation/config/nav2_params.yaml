controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0   # 20 Hz missed its rate on the Jetson (2026-11-23)
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker", "follow_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.20

    # Tag following (behavior_trees/follow_tag.xml): the goal keeps moving, so the checker
    # must not latch "position reached" (stateful), or the robot only turns toward each new
    # goal without driving to it (sim, 2026-11-24).
    follow_goal_checker:
      stateful: false
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.25

    FollowPath:
      # Rotation Shim: when the path heads more than 45 deg away from the robot's heading,
      # turn in place to face it first (checking the turn for collisions), then hand over
      # to DWB. DWB alone could not turn around in place (no reversing) and the progress
      # checker aborted (sim, 2026-11-24). It also keeps the front-facing sensors pointed
      # where the robot is going.
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "dwb_core::DWBLocalPlanner"
      angular_dist_threshold: 0.785
      forward_sampling_distance: 0.5
      rotate_to_heading_angular_vel: 0.5
      max_angular_accel: 1.0
      simulate_ahead_time: 1.0
      # First-run limits for the robot (2026-11-22): slow, and no reversing, since nothing
      # sees behind the robot (the L2 and the D435 both face +x). Raise once proven on the robot.
      debug_trajectory_details: false
      min_vel_x: 0.0
      min_vel_y: -0.2
      max_vel_x: 0.2
      max_vel_y: 0.2
      max_vel_theta: 0.6
      min_speed_xy: 0.0
      max_speed_xy: 0.2
      min_speed_theta: 0.0
      acc_lim_x: 0.5
      acc_lim_y: 0.5
      acc_lim_theta: 1.0
      decel_lim_x: -0.5
      decel_lim_y: -0.5
      decel_lim_theta: -1.0
      # ~1,000 candidate motions per cycle instead of 8,000: enough at 0.2 m/s, and the
      # Jetson keeps up. Odd vy/vtheta counts so zero is one of the samples.
      vx_samples: 8
      vy_samples: 9
      vtheta_samples: 15
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.2
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: false
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.22
      plugins: ["stvl_layer", "inflation_layer"]
      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        # Seconds a voxel outlives its last sighting. The sensors only see ahead, so a short
        # decay forgets an obstacle as soon as the robot turns to go around it. Voxels the
        # sensors see through are still cleared at once (clearing: true).
        voxel_decay: 5.0
        decay_model: 0
        voxel_size: 0.05
        track_unknown_space: true
        unknown_threshold: 15
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1
        origin_z: 0.0
        publish_voxel_map: false
        transform_tolerance: 0.2
        mapping_mode: false
        map_save_duration: 60.0
        # LiDAR only. The D435's full cloud (about 50 MB/s) starved the LiDAR subscription
        # under Zenoh on the robot (2026-11-24): the costmaps stopped receiving /lidar/points
        # and Nav2 refused to move. The camera source below stays defined for a lighter,
        # downsampled cloud later; add it back here then.
        observation_sources: pointcloud
        pointcloud:
          data_type: PointCloud2
          topic: /lidar/points
          marking: true
          clearing: true
          min_obstacle_height: 0.05
          max_obstacle_height: 1.8
          expected_update_rate: 0.2
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "voxel"
          voxel_min_points: 0
          clear_after_reading: true
          max_z: 2.0
          min_z: 0.05
          # The L2 is a 3D LiDAR: STVL's LiDAR frustum (model_type 1). The depth-camera model
          # (0) with a 360 deg horizontal FOV never cleared what the LiDAR saw through, so a
          # moving target left a trail of obstacles for the whole voxel_decay (sim, 2026-11-24).
          # decay_acceleration: voxels the LiDAR can see expire within about a second, while
          # those out of view keep the full voxel_decay.
          vertical_fov_angle: 1.67
          vertical_fov_padding: 0.05
          horizontal_fov_angle: 6.28
          decay_acceleration: 5.0
          model_type: 1
        camera:
          data_type: PointCloud2
          topic: /camera/depth/color/points
          marking: true
          clearing: true
          obstacle_range: 4.0
          min_obstacle_height: 0.05
          max_obstacle_height: 1.8
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "voxel"
          voxel_min_points: 0
          clear_after_reading: true
          max_z: 4.0
          min_z: 0.1
          vertical_fov_angle: 1.0
          horizontal_fov_angle: 1.5
          decay_acceleration: 1.0
          model_type: 0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 0.45 m with a slow fall-off (3.0) made every gap under ~1 m look expensive, so
        # the robot detoured around gaps it fits through (2026-11-23).
        cost_scaling_factor: 6.0
        inflation_radius: 0.35
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: false
      robot_radius: 0.22
      resolution: 0.05
      rolling_window: true
      width: 30
      height: 30
      track_unknown_space: true
      plugins: ["stvl_layer", "inflation_layer"]
      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        # Long enough to remember a detour's obstacle (see the local costmap).
        voxel_decay: 20.0
        decay_model: 0
        voxel_size: 0.05
        track_unknown_space: true
        unknown_threshold: 15
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1
        origin_z: 0.0
        publish_voxel_map: false
        transform_tolerance: 0.2
        mapping_mode: false
        map_save_duration: 60.0
        # LiDAR only. The D435's full cloud (about 50 MB/s) starved the LiDAR subscription
        # under Zenoh on the robot (2026-11-24): the costmaps stopped receiving /lidar/points
        # and Nav2 refused to move. The camera source below stays defined for a lighter,
        # downsampled cloud later; add it back here then.
        observation_sources: pointcloud
        pointcloud:
          data_type: PointCloud2
          topic: /lidar/points
          marking: true
          clearing: true
          min_obstacle_height: 0.05
          max_obstacle_height: 1.8
          expected_update_rate: 0.2
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "voxel"
          voxel_min_points: 0
          clear_after_reading: true
          max_z: 2.0
          min_z: 0.05
          # The L2 is a 3D LiDAR: STVL's LiDAR frustum (model_type 1). The depth-camera model
          # (0) with a 360 deg horizontal FOV never cleared what the LiDAR saw through, so a
          # moving target left a trail of obstacles for the whole voxel_decay (sim, 2026-11-24).
          # decay_acceleration: voxels the LiDAR can see expire within about a second, while
          # those out of view keep the full voxel_decay.
          vertical_fov_angle: 1.67
          vertical_fov_padding: 0.05
          horizontal_fov_angle: 6.28
          decay_acceleration: 5.0
          model_type: 1
        camera:
          data_type: PointCloud2
          topic: /camera/depth/color/points
          marking: true
          clearing: true
          obstacle_range: 4.0
          min_obstacle_height: 0.05
          max_obstacle_height: 1.8
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "voxel"
          voxel_min_points: 0
          clear_after_reading: true
          max_z: 4.0
          min_z: 0.1
          vertical_fov_angle: 1.0
          horizontal_fov_angle: 1.5
          decay_acceleration: 1.0
          model_type: 0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Global (planner) only: wider than the local costmap's, so paths keep about
        # 0.4-0.5 m from walls and corners where there is room. At 0.35 m paths passed
        # corners 10-15 cm away and DWB could not turn there (sim, 2026-11-24). The
        # fall-off (5.0) keeps a 0.8 m gap cheaper than a long detour; the earlier
        # 0.45 m at 3.0 made every gap under ~1 m look expensive (robot, 2026-11-23).
        cost_scaling_factor: 5.0
        inflation_radius: 0.55
      always_send_full_costmap: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_timeout: 0.1
    use_sim_time: false
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.6
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    # Mecanum: lateral (y) must be allowed here too. Nav2's defaults clamp vy to
    # 0, which silently drops DWB's strafing and lets the robot drift off its plan.
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.2, 0.2, 0.6]
    min_velocity: [0.0, -0.2, -0.6]   # vx >= 0: no reversing into the unseen side
    max_accel: [0.5, 0.5, 1.0]
    max_decel: [-0.5, -0.5, -1.0]
    odom_topic: "/odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

robot_state_publisher:
  ros__parameters:
    use_sim_time: false
